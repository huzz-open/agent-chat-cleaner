[workspace]
members = [
  "crates/app-core",
  "crates/scanner",
  "crates/quarantine",
  "apps/agent-chat-cleaner",
]
resolver = "2"

[workspace.package]
version = "0.7.9"
edition = "2024"
license = "MIT"

[workspace.dependencies]
agent-chat-cleaner-core = { path = "crates/app-core" }
agent-chat-cleaner-scanner = { path = "crates/scanner" }
agent-chat-cleaner-quarantine = { path = "crates/quarantine" }
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
